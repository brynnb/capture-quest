# Tygo configuration to generate TypeScript interfaces from Go structs
# Usage: npm run tygo (from the repository root)

packages:
  - path: capturequest/internal/world
    type_mappings:
      pokebattle.BattleEvent: 'import("./battle_events").BattleEvent'
      scriptedactions.Action: 'import("./scriptedactions").Action'
      int32: number
      int16: number
      int8: number
      uint32: number
      uint16: number
      uint8: number
      float32: number
      float64: number
    output_path: ../src/net/generated/world_api.ts

  - path: capturequest/internal/zone/interface
    type_mappings:
      int32: number
      int16: number
      int8: number
      uint32: number
      uint16: number
      uint8: number
      float32: number
      float64: number
    output_path: ../src/net/generated/world_interface.ts

  - path: capturequest/internal/api/opcodes
    output_path: ../src/net/generated/opcodes.ts

  - path: capturequest/internal/db/models
    type_mappings:
      time.Time: string # Go's time.Time serializes to RFC3339/ISO8601 strings in JSON
      int64: number
      int32: number
      int16: number
      int8: number
      uint64: number
      uint32: number
      uint16: number
      uint8: number
      float32: number
      float64: number
    output_path: ../src/net/generated/models.ts

  - path: capturequest/internal/scriptedactions
    include_files: [action.go]
    output_path: ../src/net/generated/scriptedactions.ts

  - path: capturequest/internal/db/cqitems
    include_files: [types.go]
    output_path: ../src/net/generated/cqitems.ts

  - path: capturequest/internal/protocol
    frontmatter: |
      import type { CharacterData as CharacterBase } from "./models";
    type_mappings:
      models.CharacterData: CharacterBase
      db_character.CharacterOptions: 'import("./character_options").CharacterOptions'
    output_path: ../src/net/generated/protocol.ts

  - path: capturequest/internal/db/character
    include_files: [character-options.go]
    output_path: ../src/net/generated/character_options.ts

  - path: capturequest/internal/pokebattle
    include_files: [battle_events.go]
    output_path: ../src/net/generated/battle_events.ts

  - path: capturequest/internal/itemuse
    include_files: [party.go]
    output_path: ../src/net/generated/itemuse.ts

  - path: capturequest/internal/staticdata
    output_path: ../src/net/generated/staticdata.ts
