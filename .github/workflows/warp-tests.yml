name: Warp Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Test hermetic warp contracts
        run: |
          cd server
          go test -p=1 -count=1 ./cmd/import-phaser \
            -run '^(TestResolveWarpDestinationUpdates.*|TestClearWarpDestinationCoordinatePlaceholdersPostgres|TestResolveLastMapWarpDestinations.*|TestResolveImportedWarpDestinations.*)$'
          go test -p=1 -count=1 ./internal/world -run 'Warp|LastMap'
