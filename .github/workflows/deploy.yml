name: Deploy CaptureQuest

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reset_database:
        description: 'Drop and rebuild the runtime database before deploying'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # An importer can outlive a lost SSH client. Queue a newer deployment rather
  # than cancelling the one that may still own a Postgres mutation.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CAPTUREQUEST_POKEMON_RELEASE: ${{ vars.CAPTUREQUEST_POKEMON_RELEASE || 'red' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/pokemon-gameboy-extractor-tool/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement tools/pokemon-gameboy-extractor-tool/requirements.txt

      - name: Compute runtime asset cache key
        id: asset-cache-key
        run: |
          set -euo pipefail
          extractor_sha="$(git -C tools/pokemon-gameboy-extractor-tool rev-parse HEAD)"
          pipeline_hash="$(
            {
              printf 'extractor=%s\n' "$extractor_sha"
              git ls-files -s \
                package-lock.json \
                scripts/bootstrap_capturequest.sh \
                scripts/generate_dungeon_hole_warps.py \
                scripts/generate_audio_manifest.mjs \
                scripts/sync_extractor_assets.py \
                scripts/sync_extractor_audio_manifest.mjs \
                server/cmd/import-script-candidates \
                public/phaser/sprites \
                2>/dev/null
            } | sha256sum | awk '{print $1}'
          )"
          release="${CAPTUREQUEST_POKEMON_RELEASE:-red}"
          # v3 includes the tile-image, sprite, and Phaser style directories in
          # both restore and save sets; v2 caches were permanently incomplete.
          echo "key=cq-runtime-assets-v3-${release}-${pipeline_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore generated runtime assets
        id: runtime-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/assets/pokemon
            public/assets/trainers
            public/phaser/assets
            public/phaser/pokemon.db
            public/phaser/capturequest-pokemon-import.json
            public/phaser/runtime_asset_contract.json
            public/phaser/style.css
            public/phaser/tile_images
            public/phaser/sprites
            public/sound/pokemon
            src/constants/asset_manifest.json
            src/constants/audio_manifest.json
            src/constants/pokemon_audio_manifest.json
            src/constants/runtime_asset_version.ts
            server/scripted_events/scripts
            server/scripted_events/*.generated.json
          key: ${{ steps.asset-cache-key.outputs.key }}

      - name: Check generated runtime assets
        id: runtime-assets
        run: |
          set -euo pipefail

          assets_ready() {
            # This function is used as an `if` condition, where Bash disables
            # errexit inside the function body. Every invariant must therefore
            # propagate failure explicitly instead of relying on `set -e`.
            test -s public/phaser/pokemon.db || return 1
            test -s public/phaser/runtime_asset_contract.json || return 1
            test -s public/phaser/capturequest-pokemon-import.json || return 1
            test -d public/phaser/assets || return 1
            test -n "$(find public/phaser/assets -type f -print -quit)" || return 1
            test -d public/phaser/tile_images || return 1
            test -n "$(find public/phaser/tile_images -type f -print -quit)" || return 1
            test -d public/phaser/sprites || return 1
            test -n "$(find public/phaser/sprites -type f -print -quit)" || return 1
            test -d public/assets/pokemon || return 1
            test -n "$(find public/assets/pokemon -type f -print -quit)" || return 1
            test -d public/assets/trainers || return 1
            test -n "$(find public/assets/trainers -type f -print -quit)" || return 1
            test -d public/sound/pokemon || return 1
            test -n "$(find public/sound/pokemon -name '*.ogg' -type f -print -quit)" || return 1
            test -s src/constants/asset_manifest.json || return 1
            test -s src/constants/audio_manifest.json || return 1
            test -s src/constants/pokemon_audio_manifest.json || return 1
            test -s src/constants/runtime_asset_version.ts || return 1
            test -d server/scripted_events/scripts || return 1
            test -n "$(find server/scripted_events/scripts -name '*.json' -type f -print -quit)" || return 1
            node - <<'NODE' || return 1
          const fs = require("fs");
          const manifestPath = "src/constants/pokemon_audio_manifest.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (!manifest.music || !manifest.sfx || !manifest.pokemonCries) {
            process.exit(1);
          }
          if (!Array.isArray(manifest.mapMusic) || manifest.mapMusic.length < 200) {
            process.exit(1);
          }
          NODE
            python3 - <<'PY' || return 1
          import sqlite3
          conn = sqlite3.connect("public/phaser/pokemon.db")
          try:
              row = conn.execute(
                  "SELECT COUNT(*) FROM script_event_dungeon_hole_warps"
              ).fetchone()
              if row is None or row[0] < 1:
                  raise SystemExit(1)
          finally:
              conn.close()
          PY
            # A tracked placeholder sprite is not evidence that the generated
            # catalog was restored. Validate the exact DB-backed tile/sprite
            # families and Phaser stylesheet before accepting the cache hit.
            python3 scripts/validate_runtime_assets.py >/dev/null || return 1
          }

          if assets_ready; then
            echo "Generated runtime assets restored from cache."
            echo "needs_generation=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generated runtime assets are missing or incomplete; rebuilding."
            echo "needs_generation=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install extractor system dependencies
        if: steps.runtime-assets.outputs.needs_generation == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libpng-dev gbsplay ffmpeg sqlite3
          git clone --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j"$(nproc)"
          sudo make -C /tmp/rgbds install PREFIX=/usr/local
          rgbgfx --version

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Generate runtime assets
        if: steps.runtime-assets.outputs.needs_generation == 'true'
        run: |
          CAPTUREQUEST_RENDER_AUDIO=1 npm run bootstrap:assets

      - name: Verify generated runtime assets
        run: |
          set -euo pipefail
          test -s public/phaser/pokemon.db
          test -s public/phaser/runtime_asset_contract.json
          test -s public/phaser/capturequest-pokemon-import.json
          npm run assets:validate
          test -d public/sound/pokemon
          test -s public/sound/pokemon/audio-render-manifest.json
          test -d server/scripted_events/scripts
          test -n "$(find server/scripted_events/scripts -name '*.json' -type f -print -quit)"
          node - <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const manifest = JSON.parse(fs.readFileSync("src/constants/pokemon_audio_manifest.json", "utf8"));
          if (!Array.isArray(manifest.mapMusic) || manifest.mapMusic.length < 200) {
            throw new Error(`Expected populated mapMusic metadata, got ${manifest.mapMusic?.length ?? 0}`);
          }
          const rendered = JSON.parse(fs.readFileSync("public/sound/pokemon/audio-render-manifest.json", "utf8"));
          const expectedProfile = {
            sampleRate: 24000,
            channels: 1,
            codec: "ogg-vorbis",
            quality: 1,
          };
          const actualProfile = rendered.renderProfile?.distribution;
          if (rendered.schemaVersion !== 2 ||
              Object.entries(expectedProfile).some(([key, value]) => actualProfile?.[key] !== value)) {
            throw new Error(`Unexpected browser audio profile: ${JSON.stringify(rendered.renderProfile?.distribution)}`);
          }
          if (!Array.isArray(rendered.artifacts) || rendered.artifacts.length !== 561) {
            throw new Error(`Expected 561 rendered assets, got ${rendered.artifacts?.length ?? 0}`);
          }
          const assetKeys = new Set();
          const logicalPaths = new Set();
          for (const artifact of rendered.artifacts) {
            if (!artifact.assetKey || assetKeys.has(artifact.assetKey)) {
              throw new Error(`Invalid or duplicate audio asset key: ${artifact.assetKey}`);
            }
            assetKeys.add(artifact.assetKey);
            const record = artifact.distribution;
            if (!record?.path?.startsWith("/sound/pokemon/")) throw new Error(`Unsafe audio path: ${record?.path}`);
            if (logicalPaths.has(record.path)) throw new Error(`Duplicate audio path: ${record.path}`);
            logicalPaths.add(record.path);
            const filename = path.join("public", record.path);
            const bytes = fs.readFileSync(filename);
            const actual = crypto.createHash("sha256").update(bytes).digest("hex");
            if (actual !== record.sha256) throw new Error(`Audio hash mismatch: ${filename}`);
          }
          if (assetKeys.size !== 561 || logicalPaths.size !== 561) {
            throw new Error("Audio manifest does not contain 561 distinct browser derivatives");
          }
          if (fs.readdirSync("public/sound/pokemon", {recursive: true}).some(name => String(name).endsWith(".flac"))) {
            throw new Error("Archival FLAC masters were copied into the public web tree");
          }
          NODE
          python3 - <<'PY'
          import sqlite3
          conn = sqlite3.connect("public/phaser/pokemon.db")
          try:
              count = conn.execute(
                  "SELECT COUNT(*) FROM script_event_dungeon_hole_warps"
              ).fetchone()[0]
              if count < 1:
                  raise SystemExit("Expected generated dungeon hole warp metadata")
          finally:
              conn.close()
          PY

      # Save a freshly generated, fully validated artifact set before unrelated
      # build or deployment failures can discard the expensive extraction work.
      - name: Save generated runtime assets
        if: steps.runtime-assets.outputs.needs_generation == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            public/assets/pokemon
            public/assets/trainers
            public/phaser/assets
            public/phaser/pokemon.db
            public/phaser/capturequest-pokemon-import.json
            public/phaser/runtime_asset_contract.json
            public/phaser/style.css
            public/phaser/tile_images
            public/phaser/sprites
            public/sound/pokemon
            src/constants/asset_manifest.json
            src/constants/audio_manifest.json
            src/constants/pokemon_audio_manifest.json
            src/constants/runtime_asset_version.ts
            server/scripted_events/scripts
            server/scripted_events/*.generated.json
          key: ${{ steps.asset-cache-key.outputs.key }}

      - name: Build Frontend
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          test -s dist/phaser/runtime_asset_contract.json
          test "$(sha256sum public/phaser/runtime_asset_contract.json | awk '{print $1}')" = "$(sha256sum dist/phaser/runtime_asset_contract.json | awk '{print $1}')"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Test warp import and runtime contracts
        run: |
          cd server
          go test -p=1 -count=1 -run 'Warp|LastMap|WorldTile|TileEditor|PhaserTilesRequest' ./cmd/import-phaser ./internal/world
          go test -p=1 -count=1 ./internal/config
          go test -p=1 -count=1 ./internal/overworldoverview
          go test -p=1 -count=1 -run 'TileArt|OverworldOverview' ./internal/server

      - name: Build Backend
        run: |
          cd server
          GOOS=linux GOARCH=amd64 go build -o server ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o import-phaser ./cmd/import-phaser

      - name: Deploy to Server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          RESET_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_database }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_APP_DIR:?DEPLOY_APP_DIR repository variable is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Long imports can be quiet for several minutes. Client keepalives
          # prevent the SSH transport from being mistaken for an idle session.
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -i ~/.ssh/deploy_key"
          HOST="$DEPLOY_HOST"
          APP_DIR="$DEPLOY_APP_DIR"
          FRONTEND_STAGE="dist.next-${GITHUB_SHA}"
          EXPECTED_CONTRACT_SHA="$(sha256sum public/phaser/runtime_asset_contract.json | awk '{print $1}')"
          CQ_SERVER_STOPPED=false
          IMPORT_STARTED=false
          IMPORT_COMPLETED=false
          DEPLOY_ACTIVATED=false
          DEPLOY_VERIFIED=false
          activate_frontend() {
            ssh $SSH_OPTS $HOST "set -euo pipefail; cd $APP_DIR; if [ -e $FRONTEND_STAGE ] || [ -L $FRONTEND_STAGE ]; then rm -rf dist.previous; if [ -e dist ] || [ -L dist ]; then mv dist dist.previous; fi; mv $FRONTEND_STAGE dist; fi; test \"\$(sha256sum dist/phaser/runtime_asset_contract.json | awk '{print \$1}')\" = \"$EXPECTED_CONTRACT_SHA\""
          }
          cleanup_cq_server() {
            if [ "$DEPLOY_ACTIVATED" = "true" ] && [ "$DEPLOY_VERIFIED" != "true" ]; then
              echo "Post-deploy verification failed; stopping the unverified cq-server release." >&2
              ssh $SSH_OPTS $HOST "sudo systemctl stop cq-server" || true
              return
            fi
            if [ "$CQ_SERVER_STOPPED" = "true" ]; then
              if [ "$IMPORT_STARTED" = "true" ] && [ "$IMPORT_COMPLETED" != "true" ]; then
                echo "Import outcome is ambiguous; leaving cq-server stopped rather than serving a mixed asset catalog." >&2
                return
              fi
              echo "Deployment failed after cq-server stopped; leaving it stopped until the database, binary, frontend, and asset contract are verified as one release." >&2
            fi
          }
          trap cleanup_cq_server EXIT

          # Upload a complete frontend release without exposing it. The live
          # dist directory continues serving the old bundle and matching API
          # until the database import has completed and the API is stopped.
          tar --exclude='._*' --exclude='.DS_Store' -czf - -C dist . | ssh $SSH_OPTS $HOST "set -euo pipefail; rm -rf $APP_DIR/$FRONTEND_STAGE; mkdir -p $APP_DIR/$FRONTEND_STAGE; cd $APP_DIR/$FRONTEND_STAGE; tar xzf -; test -s phaser/runtime_asset_contract.json"

          # Stop services before overwriting
          ssh $SSH_OPTS $HOST "sudo systemctl stop cq-server"
          CQ_SERVER_STOPPED=true

          # Upload backend
          gzip -c server/server | ssh $SSH_OPTS $HOST "gunzip > $APP_DIR/server/server && chmod +x $APP_DIR/server/server"
          gzip -c server/import-phaser | ssh $SSH_OPTS $HOST "gunzip > $APP_DIR/server/import-phaser && chmod +x $APP_DIR/server/import-phaser"
          ssh $SSH_OPTS $HOST "rm -rf $APP_DIR/server/migrations"

          # Upload database/source artifacts for deterministic Postgres imports
          tar --exclude='._*' --exclude='.DS_Store' -czf - -C server/schema . | ssh $SSH_OPTS $HOST "mkdir -p $APP_DIR/server/schema && cd $APP_DIR/server/schema && tar xzf -"
          tar --exclude='._*' --exclude='.DS_Store' -czf - -C server/scripts . | ssh $SSH_OPTS $HOST "mkdir -p $APP_DIR/server/scripts && cd $APP_DIR/server/scripts && tar xzf -"
          gzip -c public/phaser/pokemon.db | ssh $SSH_OPTS $HOST "mkdir -p $APP_DIR/public/phaser && gunzip > $APP_DIR/public/phaser/pokemon.db"
          gzip -c public/phaser/capturequest-pokemon-import.json | ssh $SSH_OPTS $HOST "mkdir -p $APP_DIR/public/phaser && gunzip > $APP_DIR/public/phaser/capturequest-pokemon-import.json"

          # Upload file-backed scripted events
          tar --exclude='._*' --exclude='.DS_Store' -czf - -C server/scripted_events . | ssh $SSH_OPTS $HOST "rm -rf $APP_DIR/server/scripted_events && mkdir -p $APP_DIR/server/scripted_events && cd $APP_DIR/server/scripted_events && tar xzf -"

          # Keep a rollback point immediately before schema/import mutations.
          backup_name="capturequest-predeploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          ssh $SSH_OPTS $HOST "set -euo pipefail; set -a; . /etc/capturequest/cq-server.env; set +a; : \${DATABASE_URL:?DATABASE_URL missing}; : \${LOCAL:?LOCAL missing}; test \"\$LOCAL\" = false; mkdir -p $APP_DIR/backups; pg_dump --no-owner --no-privileges \"\$DATABASE_URL\" | gzip -9 > $APP_DIR/backups/$backup_name; test -s $APP_DIR/backups/$backup_name"

          # Apply tracked runtime schema and refresh deterministic imported data.
          # Once this begins, a lost SSH transport makes the remote outcome
          # ambiguous; the EXIT trap deliberately leaves the API stopped.
          IMPORT_STARTED=true
          ssh $SSH_OPTS $HOST "set -euo pipefail; cd $APP_DIR; set -a; . /etc/capturequest/cq-server.env; set +a; : \${DATABASE_URL:?DATABASE_URL missing}; release=\"$CAPTUREQUEST_POKEMON_RELEASE\"; cd server; ./import-phaser --release \"\$release\" --preflight-only ../public/phaser/pokemon.db; cd ..; if [ \"$RESET_DATABASE\" = \"true\" ]; then psql \"\$DATABASE_URL\" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'; fi; psql \"\$DATABASE_URL\" -v ON_ERROR_STOP=1 -f server/schema/postgres_runtime_schema.sql; cd server; DATABASE_URL=\"\$DATABASE_URL\" ./import-phaser --release \"\$release\" ../public/phaser/pokemon.db"

          IMPORT_COMPLETED=true

          # Activate the already-validated frontend only while the API is
          # stopped. Clients can see a brief unavailable response, but can
          # never pair a new tile-ID bundle with the old Postgres catalog.
          activate_frontend

          # Restart with the matching binary, database, and frontend catalog.
          # Mark the release fail-closed before the remote start: if the SSH
          # transport or Caddy reload fails after systemd starts the process,
          # the EXIT trap must stop that unverified server.
          DEPLOY_ACTIVATED=true
          ssh $SSH_OPTS $HOST "sudo systemctl start cq-server && sudo systemctl reload caddy"
          CQ_SERVER_STOPPED=false

          # Verify the imported tile catalog and public artifact after restart.
          ssh $SSH_OPTS $HOST "set -euo pipefail; set -a; . /etc/capturequest/cq-server.env; set +a; : \${DATABASE_URL:?DATABASE_URL missing}; psql \"\$DATABASE_URL\" -v ON_ERROR_STOP=1 -Atc \"SELECT COUNT(*) FROM phaser_tiles WHERE has_tile_edit = 0 AND original_tile_image_id IS NOT NULL AND tile_image_id <> original_tile_image_id\" | grep -qx 0"
          expected_contract_sha="$(sha256sum public/phaser/runtime_asset_contract.json | awk '{print $1}')"
          deployed_contract_sha="$(curl --fail --silent --show-error https://capturequest.net/phaser/runtime_asset_contract.json | sha256sum | awk '{print $1}')"
          test "$deployed_contract_sha" = "$expected_contract_sha"
          server_ready=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 5 https://capturequest.net/api/online >/dev/null; then
              server_ready=true
              break
            fi
            sleep 5
          done
          test "$server_ready" = true
          tile_art_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://capturequest.net/api/tiles/stamps)"
          test "$tile_art_status" = 404

          # Probe a populated remote chunk, not a possibly transparent gap, so
          # success proves the server decoded the deployed tile-image catalog.
          overview_chunk="$(ssh $SSH_OPTS $HOST "set -euo pipefail; set -a; . /etc/capturequest/cq-server.env; set +a; : \${DATABASE_URL:?DATABASE_URL missing}; psql \"\$DATABASE_URL\" -v ON_ERROR_STOP=1 -At -F, -c \"SELECT floor(x / 64.0)::int, floor(y / 64.0)::int FROM phaser_tiles WHERE map_id IS NULL AND is_tile_erased = 0 ORDER BY id LIMIT 1\"")"
          IFS=, read -r overview_chunk_x overview_chunk_y <<<"$overview_chunk"
          test -n "$overview_chunk_x"
          test -n "$overview_chunk_y"
          deployed_catalog="$(curl --fail --silent --show-error 'https://capturequest.net/phaser/runtime_asset_contract.json' | python3 -c 'import json,sys; print(json.load(sys.stdin)["tileCatalogSha256"])')"
          overview_headers="$(curl --fail --silent --show-error --head "https://capturequest.net/api/overworld/overview?chunkX=${overview_chunk_x}&chunkY=${overview_chunk_y}&catalog=${deployed_catalog}")"
          grep -Eiq '^content-type: image/png' <<<"$overview_headers"
          grep -Eiq '^etag: "cq-overworld-v1-[0-9a-f]{64}"' <<<"$overview_headers"
          grep -Eiq '^cache-control: public, no-cache' <<<"$overview_headers"
          grep -Fiq "x-overworld-tile-catalog: ${deployed_catalog}" <<<"$overview_headers"
          stale_catalog="$(python3 -c 'import sys; current=sys.argv[1]; print(("0" if current != "0"*64 else "1")*64)' "$deployed_catalog")"
          stale_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://capturequest.net/api/overworld/overview?chunkX=${overview_chunk_x}&chunkY=${overview_chunk_y}&catalog=${stale_catalog}")"
          test "$stale_status" = 409

          DEPLOY_VERIFIED=true
          rm -f ~/.ssh/deploy_key
